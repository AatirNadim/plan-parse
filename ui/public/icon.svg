<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Square Squircle Canvas (Solid Workbench Obsidian - No Gradient Slop) -->
  <rect width="512" height="512" rx="112" fill="#090A0F"/>
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="#232936" stroke-width="2"/>

  <!-- Left: Wide Code Gutter Column (Workbench Panel Style) -->
  <rect x="100" y="96" width="116" height="320" rx="20" fill="#0F121A" stroke="#232936" stroke-width="2"/>

  <!-- Editor Gutter Margin / Rule Line -->
  <line x1="122" y1="112" x2="122" y2="400" stroke="#232936" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Syntax-Highlighted Horizontal Code Tubes (Terraform HCL AST) -->
  <!-- Block 1: Resource keyword + name (Module Indigo & Sky tokens) -->
  <rect x="132" y="122" width="68" height="14" rx="7" fill="#6366F1"/>
  <rect x="144" y="146" width="52" height="12" rx="6" fill="#38BDF8"/>
  <rect x="144" y="168" width="60" height="12" rx="6" fill="#94A3B8" opacity="0.8"/>
  <rect x="144" y="190" width="38" height="12" rx="6" fill="#717D96" opacity="0.6"/>
  <rect x="132" y="212" width="22" height="12" rx="6" fill="#475569" opacity="0.7"/>

  <!-- Block 2: Plan Diff Block (Added Emerald & Changed Amber tokens) -->
  <rect x="132" y="244" width="64" height="14" rx="7" fill="#10B981"/>
  <rect x="144" y="268" width="56" height="12" rx="6" fill="#34D399" opacity="0.9"/>
  <rect x="144" y="290" width="44" height="12" rx="6" fill="#F59E0B" opacity="0.9"/>
  <rect x="132" y="312" width="24" height="12" rx="6" fill="#475569" opacity="0.7"/>

  <!-- Block 3: Stem Descender / Execution Output (Fuchsia & Slate) -->
  <rect x="132" y="344" width="60" height="14" rx="7" fill="#D946EF" opacity="0.85"/>
  <rect x="144" y="368" width="48" height="12" rx="6" fill="#717D96" opacity="0.6"/>
  <rect x="132" y="390" width="26" height="10" rx="5" fill="#334155" opacity="0.5"/>

  <!-- Right: Perfect Semicircular Half-Tube Track (The Parsed DAG) -->
  <!-- Track Outer Casing: Center (296, 224), Radius 76, Stroke Width 46 (Workbench Subpanel) -->
  <path d="M 210 148 H 296 A 76 76 0 0 1 296 300 H 210" 
        stroke="#151924" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Track Border Outline -->
  <path d="M 210 148 H 296 A 76 76 0 0 1 296 300 H 210" 
        stroke="#232936" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M 210 148 H 296 A 76 76 0 0 1 296 300 H 210" 
        stroke="#151924" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Abrupt Color Transitions on Conduit Core (No Gradients) -->
  <!-- 1. BLUE Segment: From Gutter entry (216, 148) around upper curve to cut point (361.8, 186.0) -->
  <path d="M 216 148 H 296 A 76 76 0 0 1 361.8 186.0" 
        stroke="#0284C7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. GREEN Segment: Abrupt transition at (361.8, 186.0), wrapping apex to (361.8, 262.0) -->
  <path d="M 361.8 186.0 A 76 76 0 0 1 361.8 262.0" 
        stroke="#10B981" stroke-width="8" stroke-linecap="butt"/>

  <!-- 3. YELLOW Segment: Abrupt transition at (361.8, 262.0), lower curve to gutter return (216, 300) -->
  <path d="M 361.8 262.0 A 76 76 0 0 1 296 300 H 216" 
        stroke="#F59E0B" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Precision Cut Accent Lines (Clean architectural joints) -->
  <!-- Blue -> Green Cut Marker at 30° above horizontal -->
  <!-- <line x1="358" y1="183.8" x2="365.6" y2="188.2" stroke="#090A0F" stroke-width="2"/> -->
  <!-- Green -> Yellow Cut Marker at 30° below horizontal -->
  <!-- <line x1="358" y1="264.2" x2="365.6" y2="259.8" stroke="#090A0F" stroke-width="2"/> -->

  <!-- Internal DAG Dependency Chord (Cross-edge connecting Root to Exit) -->
  <path d="M 252 148 L 336 270" stroke="#717D96" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.6"/>

  <!-- DAG Action Nodes on the Half-Tube (Crisp Flat Badges - No Fuzzy Glow Slop) -->

  <!-- Node 1: UPDATE Node (Upper Blue Arm at x=252, y=148) -->
  <g transform="translate(252, 148)">
    <circle cx="0" cy="0" r="19" fill="#0C0E14" stroke="#0284C7" stroke-width="3"/>
    <circle cx="0" cy="0" r="13" fill="#0284C7" fill-opacity="0.15"/>
    <!-- Update Symbol (~) -->
    <path d="M-6 0C-4 -3 -2 -3 0 0C2 3 4 3 6 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Node 2: CREATE Node (Apex Green Crest of Half-Tube Arc at x=372, y=224) -->
  <g transform="translate(372, 224)">
    <circle cx="0" cy="0" r="22" fill="#0C0E14" stroke="#10B981" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="15" fill="#10B981" fill-opacity="0.2"/>
    <!-- Create Symbol (+) -->
    <path d="M-7 0H7M0 -7V7" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Node 3: REPLACE Node (Lower Yellow Return Arm at x=268, y=300) -->
  <g transform="translate(268, 300)">
    <circle cx="0" cy="0" r="19" fill="#0C0E14" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="0" cy="0" r="13" fill="#F59E0B" fill-opacity="0.15"/>
    <!-- Replace Symbol (±) -->
    <path d="M-5 -2H5M0 -7V3M-5 6H5" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Return Flow Indicator into Gutter -->
  <path d="M 228 294 L 218 300 L 228 306" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

