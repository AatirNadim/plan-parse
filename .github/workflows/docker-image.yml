name: Docker Image

on:
  workflow_call:
    inputs:
      push:
        description: 'Whether to push Docker image to registry'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version string for image build and metadata'
        required: false
        type: string
        default: ''
      is_latest:
        description: 'Whether to tag image as latest'
        required: false
        type: string
        default: 'true'
  workflow_dispatch:
    inputs:
      push:
        description: 'Whether to push Docker image to registry'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version string for image build and metadata'
        required: false
        type: string
        default: ''
      is_latest:
        description: 'Whether to tag image as latest'
        required: false
        type: string
        default: 'true'

permissions:
  contents: read

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Hub repository
        id: image-name
        env:
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          REPO="$DOCKERHUB_REPO"
          if [ -z "$REPO" ]; then
            USER="$DOCKERHUB_USER"
            if [ -z "$USER" ]; then
              USER="$REPO_OWNER"
            fi
            REPO_NAME="$EVENT_REPO_NAME"
            if [ -z "$REPO_NAME" ]; then
              REPO_NAME="${GITHUB_REPOSITORY#*/}"
            fi
            REPO="$USER/$REPO_NAME"
          fi
          echo "image=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-name.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ inputs.push && (inputs.is_latest == 'true' || inputs.is_latest == true) && !contains(inputs.version || github.ref_name, '-') }}
            type=sha,format=long,prefix=,enable=true
            type=sha,format=short,prefix=,enable=true
            type=semver,pattern={{version}},enable=${{ inputs.version == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.version == '' }}
            type=semver,pattern={{major}},enable=${{ inputs.version == '' && (inputs.is_latest == 'true' || inputs.is_latest == true) }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && (inputs.is_latest == 'true' || inputs.is_latest == true) }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
