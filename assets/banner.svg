<svg width="100%" height="280" viewBox="0 0 960 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Web Font Imports -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap');

      .brand-title {
        font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
        font-size: 52px;
        font-weight: 500;
        fill: #FFFFFF;
        letter-spacing: -1.5px;
      }
      .brand-slash {
        font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 52px;
        font-weight: 500;
        fill: #38BDF8;
        opacity: 0.65;
      }
      .brand-subtitle {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #94A3B8;
        letter-spacing: 0.15px;
      }
      .badge-text {
        font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.8px;
      }
      .chip-text {
        font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.3px;
      }
      .meta-text {
        font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 1px;
        fill: #475569;
      }
    </style>

    <!-- Engineering Grid Pattern (Matches UI Canvas Background) -->
    <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1A2233"/>
    </pattern>

    <!-- Ambient Glow: Cyan / Indigo workbench lighting -->
    <radialGradient id="logo-glow" cx="142" cy="140" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="card-glow" cx="540" cy="140" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Accent Gradient Line -->
    <linearGradient id="top-border-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="22%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="78%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>

    <!-- Logo Drop Shadow Filter -->
    <filter id="logo-elevation" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Banner Outer Shell (Solid Workbench Obsidian) -->
  <rect width="960" height="280" rx="16" fill="#090A0F"/>

  <!-- Precision Canvas Grid Layer -->
  <rect width="960" height="280" rx="16" fill="url(#grid-dots)"/>

  <!-- Ambient Light Washes -->
  <circle cx="142" cy="140" r="160" fill="url(#logo-glow)"/>
  <rect width="960" height="280" rx="16" fill="url(#card-glow)"/>

  <!-- Card Border -->
  <rect x="0.75" y="0.75" width="958.5" height="278.5" rx="15.25" fill="none" stroke="#232936" stroke-width="1.5"/>

  <!-- Top Hairline Accent (Engineering Polish) -->
  <line x1="32" y1="1" x2="928" y2="1" stroke="url(#top-border-accent)" stroke-width="1.5"/>

  <!-- Left: The Plan-Parse Brand Logo -->
  <g transform="translate(52, 50) scale(0.3515625)" filter="url(#logo-elevation)">
    <!-- Rounded Square Squircle Canvas -->
    <rect width="512" height="512" rx="112" fill="#090A0F"/>
    <rect x="6" y="6" width="500" height="500" rx="106" stroke="#232936" stroke-width="2"/>

    <!-- Left: Wide Code Gutter Column (Workbench Panel Style) -->
    <rect x="100" y="96" width="116" height="320" rx="20" fill="#0F121A" stroke="#232936" stroke-width="2"/>

    <!-- Editor Gutter Margin / Rule Line -->
    <line x1="122" y1="112" x2="122" y2="400" stroke="#232936" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Syntax-Highlighted Horizontal Code Tubes (Terraform HCL AST) -->
    <!-- Block 1: Resource keyword + name (Module Indigo & Sky tokens) -->
    <rect x="132" y="122" width="68" height="14" rx="7" fill="#6366F1"/>
    <rect x="144" y="146" width="52" height="12" rx="6" fill="#38BDF8"/>
    <rect x="144" y="168" width="60" height="12" rx="6" fill="#94A3B8" opacity="0.8"/>
    <rect x="144" y="190" width="38" height="12" rx="6" fill="#717D96" opacity="0.6"/>
    <rect x="132" y="212" width="22" height="12" rx="6" fill="#475569" opacity="0.7"/>

    <!-- Block 2: Plan Diff Block (Added Emerald & Changed Amber tokens) -->
    <rect x="132" y="244" width="64" height="14" rx="7" fill="#10B981"/>
    <rect x="144" y="268" width="56" height="12" rx="6" fill="#34D399" opacity="0.9"/>
    <rect x="144" y="290" width="44" height="12" rx="6" fill="#F59E0B" opacity="0.9"/>
    <rect x="132" y="312" width="24" height="12" rx="6" fill="#475569" opacity="0.7"/>

    <!-- Block 3: Stem Descender / Execution Output (Fuchsia & Slate) -->
    <rect x="132" y="344" width="60" height="14" rx="7" fill="#D946EF" opacity="0.85"/>
    <rect x="144" y="368" width="48" height="12" rx="6" fill="#717D96" opacity="0.6"/>
    <rect x="132" y="390" width="26" height="10" rx="5" fill="#334155" opacity="0.5"/>

    <!-- Right: Perfect Semicircular Half-Tube Track (The Parsed DAG) -->
    <path d="M 210 148 H 296 A 76 76 0 0 1 296 300 H 210" 
          stroke="#3B4861" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 210 148 H 296 A 76 76 0 0 1 296 300 H 210" 
          stroke="#1F2638" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Conduit Core (Abrupt Transitions) -->
    <path d="M 216 148 H 296 A 76 76 0 0 1 361.8 186.0" 
          stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 361.8 186.0 A 76 76 0 0 1 361.8 262.0" 
          stroke="#34D399" stroke-width="12" stroke-linecap="butt"/>
    <path d="M 361.8 262.0 A 76 76 0 0 1 296 300 H 216" 
          stroke="#FBBF24" stroke-width="12" stroke-linecap="butt" stroke-linejoin="round"/>

    <!-- Internal DAG Dependency Chord -->
    <path d="M 252 148 L 336 270" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="5 5" opacity="0.8"/>

    <!-- Action Nodes -->
    <!-- Node 1: UPDATE (~ at 252, 148) -->
    <g transform="translate(252, 148)">
      <circle cx="0" cy="0" r="19" fill="#0C0E14" stroke="#38BDF8" stroke-width="3"/>
      <circle cx="0" cy="0" r="13" fill="#38BDF8" fill-opacity="0.25"/>
      <path d="M-6 0C-4 -3 -2 -3 0 0C2 3 4 3 6 0" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Node 2: CREATE (+ at 372, 224) -->
    <g transform="translate(372, 224)">
      <circle cx="0" cy="0" r="22" fill="#0C0E14" stroke="#34D399" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="15" fill="#34D399" fill-opacity="0.25"/>
      <path d="M-7 0H7M0 -7V7" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Node 3: REPLACE (± at 268, 300) -->
    <g transform="translate(268, 300)">
      <circle cx="0" cy="0" r="19" fill="#0C0E14" stroke="#FBBF24" stroke-width="3"/>
      <circle cx="0" cy="0" r="13" fill="#FBBF24" fill-opacity="0.25"/>
      <path d="M-5 -2H5M0 -7V3M-5 6H5" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Return Flow Indicator -->
    <path d="M 228 294 L 218 300 L 228 306" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right: Typography & Workbench Identity -->
  <!-- 1. Context Eyebrow / Breadcrumbs -->
  <g transform="translate(268, 52)">
    <rect x="0" y="0" width="144" height="22" rx="4" fill="#38BDF8" stroke="#38BDF8" stroke-width="1"/>
    <!-- <circle cx="11" cy="11" r="3.5" fill="#10B981"/> -->
    <text x="8" y="14.5" fill="#232936" class="badge-text">DEVELOPER WORKBENCH</text>

    <rect x="155" y="0" width="146" height="22" rx="4" fill="#94A3B8" stroke="#94A3B8" stroke-width="1"/>
    <text x="160" y="14.5" fill="#232936" class="badge-text">TERRAFORM DAG ENGINE</text>
  </g>

  <!-- 2. Main Title: "plan-parse" in DM Mono -->
  <g transform="translate(268, 122)">
    <text x="0" y="0" class="brand-title">plan-parse</text>
    <text x="324" y="0" class="brand-slash">/</text>
    <rect x="356" y="-30" width="46" height="20" rx="4" fill="#151924" stroke="#232936" stroke-width="1"/>
    <text x="379" y="-16.5" text-anchor="middle" fill="#64748B" class="badge-text" font-size="9.5">v1.0</text>
  </g>

  <!-- 3. Subtitle Description -->
  <text x="268" y="156" class="brand-subtitle">Interactive visualizer &amp; dependency DAG analyzer for Terraform execution plans</text>

  <!-- 4. Blast Radius Action Micro-Chips (Matching UI Theme) -->
  <g transform="translate(268, 186)">
    <!-- + CREATE -->
    <rect x="0" y="0" width="84" height="24" rx="4" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-width="1"/>
    <text x="42" y="16" text-anchor="middle" fill="#10B981" class="chip-text">+ CREATE</text>

    <!-- ~ UPDATE -->
    <rect x="92" y="0" width="86" height="24" rx="4" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
    <text x="135" y="16" text-anchor="middle" fill="#38BDF8" class="chip-text">~ UPDATE</text>

    <!-- - DELETE -->
    <rect x="186" y="0" width="84" height="24" rx="4" fill="#F43F5E" fill-opacity="0.12" stroke="#F43F5E" stroke-width="1"/>
    <text x="228" y="16" text-anchor="middle" fill="#FB7185" class="chip-text">- DELETE</text>

    <!-- ± REPLACE -->
    <rect x="278" y="0" width="90" height="24" rx="4" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1"/>
    <text x="323" y="16" text-anchor="middle" fill="#FBBF24" class="chip-text">± REPLACE</text>

    <!-- ⌘K QUICK JUMP -->
    <rect x="376" y="0" width="112" height="24" rx="4" fill="#151924" stroke="#232936" stroke-width="1"/>
    <text x="432" y="16" text-anchor="middle" fill="#94A3B8" class="chip-text">⌘K QUICK JUMP</text>
  </g>

  <!-- 5. Technical Stack Metadata in Footer -->
  <text x="908" y="240" text-anchor="end" class="meta-text">CYTOSCAPE.JS  •  GO 1.27  •  NEXT.JS 14</text>
</svg>

