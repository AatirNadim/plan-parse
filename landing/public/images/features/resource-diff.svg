<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dots-rd" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2638" />
    </pattern>
    <filter id="glow-rd" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#090a0f" />
  <rect width="960" height="540" fill="url(#grid-dots-rd)" />

  <!-- LEFT COLUMN: TIER 1 NODE & POPOVER (Compact on-canvas inspector) -->
  <g transform="translate(40, 70)">
    <!-- Anchor Node on Canvas -->
    <rect width="260" height="80" rx="8" fill="#0f121a" stroke="#0ea5e9" stroke-width="2" />
    <rect x="0" y="0" width="260" height="26" rx="8" fill="#161b26" />
    <rect x="10" y="5" width="60" height="16" rx="4" fill="#0ea5e9" fill-opacity="0.2" />
    <text x="16" y="17" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10" font-weight="700">~ UPDATE</text>
    <text x="12" y="46" fill="#f1f5f9" font-family="'DM Mono', monospace" font-size="12" font-weight="600">aws_security_group</text>
    <text x="12" y="66" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">.ingress_traffic</text>

    <!-- Anchored Tier 1 Popover Card -->
    <g transform="translate(0, 100)">
      <!-- Connecting Pointer -->
      <polygon points="120,0 130,-12 140,0" fill="#151924" stroke="#232936" stroke-width="1.5" />
      <rect width="260" height="230" rx="10" fill="#151924" stroke="#232936" stroke-width="1.5" />
      
      <!-- Popover Header -->
      <rect x="0" y="0" width="260" height="34" rx="10" fill="#1c2233" />
      <text x="12" y="22" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Tier 1: Quick Delta Popover</text>
      <rect x="194" y="8" width="54" height="18" rx="4" fill="#090a0f" />
      <text x="200" y="20" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">[Space]</text>

      <!-- Delta Summary Pills -->
      <g transform="translate(12, 46)">
        <rect x="0" y="0" width="68" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
        <text x="8" y="15" fill="#34d399" font-family="'DM Mono', monospace" font-size="11" font-weight="600">+12 added</text>

        <rect x="74" y="0" width="76" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1" />
        <text x="82" y="15" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="11" font-weight="600">~3 modified</text>

        <rect x="156" y="0" width="76" height="22" rx="4" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" />
        <text x="164" y="15" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="11" font-weight="600">-1 removed</text>
      </g>

      <!-- Replacement Warning Pill -->
      <rect x="12" y="78" width="236" height="24" rx="4" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1" />
      <circle cx="24" cy="90" r="3" fill="#f59e0b" />
      <text x="32" y="94" fill="#fbbf24" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600">Warning: Ingress rule replacement</text>

      <!-- Key Property Changes Preview -->
      <g transform="translate(12, 114)">
        <text x="0" y="14" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">cidr_blocks:</text>
        <text x="0" y="30" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="10">- ["0.0.0.0/0"]</text>
        <text x="0" y="46" fill="#10b981" font-family="'DM Mono', monospace" font-size="10">+ ["10.0.0.0/16", "172.16.0.0/12"]</text>
      </g>

      <!-- Deep Diff Button Trigger -->
      <rect x="12" y="180" width="236" height="34" rx="6" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="56" y="202" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Inspect Deep Diff [D]</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: TIER 2 FULL MODAL (Deep Inspection) -->
  <g transform="translate(340, 50)">
    <!-- Modal Window Canvas -->
    <rect width="580" height="430" rx="10" fill="#0e121a" stroke="#232936" stroke-width="1.5" />
    
    <!-- Modal Header -->
    <rect x="0" y="0" width="580" height="42" rx="10" fill="#161b26" />
    <circle cx="20" cy="21" r="5" fill="#f43f5e" />
    <circle cx="36" cy="21" r="5" fill="#f59e0b" />
    <circle cx="52" cy="21" r="5" fill="#10b981" />
    <text x="76" y="26" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="11" font-weight="600">aws_security_group.ingress_traffic</text>
    <rect x="365" y="11" width="105" height="20" rx="4" fill="#090a0f" stroke="#0ea5e9" stroke-width="0.8" />
    <circle cx="376" cy="21" r="3" fill="#10b981" />
    <text x="385" y="25" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">main.tf:24</text>
    <rect x="490" y="11" width="70" height="20" rx="4" fill="#090a0f" />
    <text x="498" y="25" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">ESC Close</text>

    <!-- Modal Navigation Tabs (Unified HCL, Split View, Attributes Matrix) -->
    <g transform="translate(20, 52)">
      <!-- Tab 1: Unified Diff [Active] -->
      <rect x="0" y="0" width="130" height="30" rx="5" fill="#0ea5e9" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="14" y="19" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Unified HCL Diff</text>

      <!-- Tab 2: Split View -->
      <rect x="140" y="0" width="110" height="30" rx="5" fill="#161b26" stroke="#232936" />
      <text x="156" y="19" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Side-by-Side</text>

      <!-- Tab 3: Attributes JSON Matrix -->
      <rect x="260" y="0" width="160" height="30" rx="5" fill="#161b26" stroke="#232936" />
      <text x="274" y="19" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Attributes Matrix (JSON)</text>

      <!-- Filter Toggle -->
      <rect x="430" y="4" width="110" height="22" rx="4" fill="#090a0f" stroke="#232936" />
      <circle cx="442" cy="15" r="3" fill="#0ea5e9" />
      <text x="452" y="19" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="9">Changed Only</text>
    </g>

    <!-- Code Editor Body with Line Gutters -->
    <g transform="translate(20, 94)">
      <!-- Editor Window Frame -->
      <rect width="540" height="316" rx="6" fill="#090a0f" stroke="#232936" />
      
      <!-- Gutter Column -->
      <rect width="40" height="316" rx="6" fill="#0d1017" />
      <line x1="40" y1="0" x2="40" y2="316" stroke="#1c2233" />

      <!-- Line Numbers -->
      <text x="20" y="24" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">24</text>
      <text x="20" y="44" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">25</text>
      <text x="20" y="64" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">26</text>
      <text x="20" y="84" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">27</text>
      <text x="20" y="104" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">28</text>
      <text x="20" y="124" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">29</text>
      <text x="20" y="144" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">30</text>
      <text x="20" y="164" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">31</text>
      <text x="20" y="184" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">32</text>
      <text x="20" y="204" text-anchor="middle" fill="#475569" font-family="'DM Mono', monospace" font-size="11">33</text>

      <!-- Code Lines Content -->
      <!-- Standard Lines -->
      <text x="54" y="24" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">  resource "aws_security_group" "ingress_traffic" &#123;</text>
      <text x="54" y="44" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">    name        = "production-ingress"</text>
      <text x="54" y="64" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">    description = "Managed VPC TLS ingress rule"</text>

      <!-- Deletion Block (Red highlight) -->
      <rect x="41" y="70" width="498" height="20" fill="#f43f5e" fill-opacity="0.15" />
      <text x="46" y="84" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="11">-   cidr_blocks = ["0.0.0.0/0"] # UNRESTRICTED ACCESS</text>

      <!-- Addition Block 1 (Green highlight) -->
      <rect x="41" y="90" width="498" height="20" fill="#10b981" fill-opacity="0.15" />
      <text x="46" y="104" fill="#34d399" font-family="'DM Mono', monospace" font-size="11">+   cidr_blocks = [</text>

      <!-- Addition Block 2 -->
      <rect x="41" y="110" width="498" height="20" fill="#10b981" fill-opacity="0.15" />
      <text x="46" y="124" fill="#34d399" font-family="'DM Mono', monospace" font-size="11">+     "10.0.0.0/16",    # Internal VPC CIDR</text>

      <!-- Addition Block 3 -->
      <rect x="41" y="130" width="498" height="20" fill="#10b981" fill-opacity="0.15" />
      <text x="46" y="144" fill="#34d399" font-family="'DM Mono', monospace" font-size="11">+     "172.16.0.0/12",  # Corporate VPN Gateway</text>

      <!-- Addition Block 4 -->
      <rect x="41" y="150" width="498" height="20" fill="#10b981" fill-opacity="0.15" />
      <text x="46" y="164" fill="#34d399" font-family="'DM Mono', monospace" font-size="11">+   ]</text>

      <!-- Unchanged Followup -->
      <text x="54" y="184" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">    from_port   = 443</text>
      <text x="54" y="204" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">    to_port     = 443</text>
      <text x="54" y="224" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">    protocol    = "tcp"</text>
      <text x="54" y="244" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">  &#125;</text>
    </g>
  </g>

  <!-- CALLOUT PINS & LEADER LINES -->

  <!-- PIN 1: Tier 1 Quick Popover -->
  <line x1="170" y1="210" x2="170" y2="440" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(170, 452)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-rd)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">1</text>
  </g>

  <!-- PIN 2: Tier 2 Unified HCL Diff -->
  <line x1="580" y1="250" x2="580" y2="490" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(580, 502)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-rd)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">2</text>
  </g>

  <!-- PIN 3: Side-by-Side (Split) View Tab -->
  <line x1="540" y1="92" x2="540" y2="24" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(540, 16)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-rd)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">3</text>
  </g>

  <!-- PIN 4: Attributes JSON Matrix Tab -->
  <line x1="680" y1="92" x2="680" y2="24" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(680, 16)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-rd)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">4</text>
  </g>

  <!-- PIN 5: AST Source Filepath Recovery -->
  <line x1="787" y1="52" x2="787" y2="24" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(787, 16)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-rd)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">5</text>
  </g>
</svg>
