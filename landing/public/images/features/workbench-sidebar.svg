<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dots-ws" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2638" />
    </pattern>
    <filter id="glow-ws" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#0ea5e9" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#090a0f" />

  <!-- LEFT DOCKED WORKBENCH SIDEBAR -->
  <g transform="translate(30, 20)">
    <!-- Main Sidebar Container Frame -->
    <rect width="400" height="500" rx="12" fill="#0f121a" stroke="#232936" stroke-width="1.8" />
    
    <!-- Sidebar Header Bar -->
    <rect x="0" y="0" width="400" height="42" rx="12" fill="#161b26" />
    <circle cx="24" cy="21" r="5" fill="#10b981" />
    <text x="38" y="26" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="12" font-weight="600">RESOURCES EXPLORER</text>
    <rect x="350" y="11" width="30" height="20" rx="4" fill="#090a0f" stroke="#232936" />
    <text x="360" y="25" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">[</text>

    <!-- SECTION 1: SEARCH INPUT (Callout 1) -->
    <g transform="translate(16, 54)">
      <rect width="368" height="34" rx="6" fill="#090a0f" stroke="#232936" />
      <circle cx="16" cy="17" r="5" stroke="#64748b" stroke-width="1.5" fill="none" />
      <line x1="20" y1="21" x2="25" y2="26" stroke="#64748b" stroke-width="1.5" />
      <text x="36" y="22" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="12">Filter by address, type, or module...</text>
      <rect x="330" y="8" width="26" height="18" rx="3" fill="#161b26" />
      <text x="336" y="21" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">⌘F</text>
    </g>

    <!-- SECTION 2: ACTION FILTER PILLS (Callout 2) -->
    <g transform="translate(16, 100)">
      <!-- All -->
      <rect x="0" y="0" width="56" height="24" rx="4" fill="#161b26" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="10" y="16" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10" font-weight="600">All (42)</text>

      <!-- Create -->
      <rect x="62" y="0" width="60" height="24" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="70" y="16" fill="#34d399" font-family="'DM Mono', monospace" font-size="10">+ (4)</text>

      <!-- Update -->
      <rect x="128" y="0" width="60" height="24" rx="4" fill="#0ea5e9" fill-opacity="0.15" stroke="#0ea5e9" stroke-width="1" />
      <text x="136" y="16" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">~ (2)</text>

      <!-- Replace -->
      <rect x="194" y="0" width="60" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
      <text x="202" y="16" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="10">± (1)</text>

      <!-- Delete -->
      <rect x="260" y="0" width="60" height="24" rx="4" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" />
      <text x="268" y="16" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="10">- (1)</text>
    </g>

    <!-- SECTION 3: MODULE HIERARCHY TREE (Callout 3) -->
    <g transform="translate(16, 136)">
      <rect width="368" height="220" rx="8" fill="#090a0f" stroke="#232936" />
      
      <!-- Module 1: module.vpc (Expanded) -->
      <g transform="translate(12, 16)">
        <text x="0" y="12" fill="#8b5cf6" font-family="'DM Mono', monospace" font-size="11">▼ module.vpc</text>
        
        <!-- Child 1: aws_vpc.main -->
        <g transform="translate(16, 24)">
          <circle cx="4" cy="6" r="3" fill="#64748b" />
          <text x="14" y="10" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">aws_vpc.main</text>
          <text x="280" y="10" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">= no-op</text>
        </g>

        <!-- Child 2: aws_subnet.public[0] -->
        <g transform="translate(16, 46)">
          <circle cx="4" cy="6" r="3" fill="#0ea5e9" />
          <text x="14" y="10" fill="#f1f5f9" font-family="'DM Mono', monospace" font-size="11">aws_subnet.public[0]</text>
          <text x="274" y="10" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">~ update</text>
        </g>

        <!-- Child 3: aws_route_table.public -->
        <g transform="translate(16, 68)">
          <circle cx="4" cy="6" r="3" fill="#10b981" />
          <text x="14" y="10" fill="#f1f5f9" font-family="'DM Mono', monospace" font-size="11">aws_route_table.public</text>
          <text x="276" y="10" fill="#34d399" font-family="'DM Mono', monospace" font-size="10">+ create</text>
        </g>
      </g>

      <!-- Module 2: module.database (Expanded) -->
      <g transform="translate(12, 126)">
        <text x="0" y="12" fill="#8b5cf6" font-family="'DM Mono', monospace" font-size="11">▼ module.database</text>
        
        <!-- Child 1: aws_db_instance.primary -->
        <g transform="translate(16, 24)">
          <circle cx="4" cy="6" r="3" fill="#f59e0b" />
          <text x="14" y="10" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="11">aws_db_instance.primary</text>
          <text x="268" y="10" fill="#f59e0b" font-family="'DM Mono', monospace" font-size="10">± replace</text>
        </g>

        <!-- Child 2: aws_db_parameter_group -->
        <g transform="translate(16, 46)">
          <circle cx="4" cy="6" r="3" fill="#0ea5e9" />
          <text x="14" y="10" fill="#f1f5f9" font-family="'DM Mono', monospace" font-size="11">aws_db_parameter_group</text>
          <text x="274" y="10" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">~ update</text>
        </g>
      </g>
    </g>

    <!-- SECTION 4: INGESTION DROPZONE (Callout 4) -->
    <g transform="translate(16, 370)">
      <rect width="368" height="110" rx="8" fill="#161b26" stroke="#3b4861" stroke-width="1.5" stroke-dasharray="4 4" />
      <g transform="translate(184, 30)">
        <circle cx="0" cy="0" r="14" fill="#0f121a" stroke="#0ea5e9" stroke-width="1.2" />
        <path d="M -4 2 L 0 -4 L 4 2 M 0 -4 L 0 6" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      </g>
      <text x="184" y="62" text-anchor="middle" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Drag &amp; drop plan.json</text>
      <text x="184" y="78" text-anchor="middle" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="10">Preflight schema verification • up to 50MB</text>
      <text x="184" y="94" text-anchor="middle" fill="#10b981" font-family="'DM Mono', monospace" font-size="9">100% Local • Zero Telemetry</text>
    </g>
  </g>

  <!-- RIGHT CANVAS BACKGROUND MOCKUP -->
  <g transform="translate(480, 140)">
    <rect width="440" height="260" rx="10" fill="#0f121a" stroke="#232936" stroke-width="1.5" />
    <circle cx="220" cy="130" r="40" fill="#161b26" stroke="#0ea5e9" stroke-width="2" />
    <text x="220" y="134" text-anchor="middle" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="12">CANVAS DAG</text>
  </g>

  <!-- CALLOUT PINS & LEADER LINES -->

  <!-- PIN 1: Real-Time Resource Search -->
  <line x1="400" y1="90" x2="460" y2="90" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(474, 90)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ws)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">1</text>
  </g>

  <!-- PIN 2: Action Filter Pills -->
  <line x1="370" y1="134" x2="460" y2="134" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(474, 134)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ws)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">2</text>
  </g>

  <!-- PIN 3: Module Hierarchy Tree -->
  <line x1="400" y1="260" x2="460" y2="260" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(474, 260)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ws)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">3</text>
  </g>

  <!-- PIN 4: Drag-and-Drop Ingestion Zone -->
  <line x1="400" y1="440" x2="460" y2="440" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(474, 440)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ws)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">4</text>
  </g>

  <!-- AST Provenance Card -->
  <g transform="translate(500, 418)">
    <rect width="330" height="66" rx="8" fill="#161b26" stroke="#232936" stroke-width="1.2" />
    <rect x="12" y="12" width="112" height="20" rx="4" fill="#090a0f" stroke="#0ea5e9" stroke-width="0.8" />
    <circle cx="22" cy="22" r="3" fill="#10b981" />
    <text x="30" y="26" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">main.tf:24</text>
    <text x="132" y="26" fill="#10b981" font-family="'DM Mono', monospace" font-size="9">AST Resolved</text>
    <text x="12" y="50" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="10">CLI workspace resolves AST • Fallback to 'unknown file'</text>
  </g>

  <!-- PIN 5: Source Filepath & AST Provenance -->
  <line x1="835" y1="451" x2="886" y2="451" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(904, 451)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ws)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">5</text>
  </g>
</svg>
