<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dots-br" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2638" />
    </pattern>
    <filter id="glow-br" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow-br" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#090a0f" />

  <!-- BLAST RADIUS FLOATING HUD (Top-Center Canvas) -->
  <g id="blast-radius-hud" transform="translate(180, 24)">
    <rect width="610" height="64" rx="10" fill="#0f121a" stroke="#232936" stroke-width="1.5" />
    
    <!-- Status / Header -->
    <circle cx="24" cy="32" r="6" fill="#f59e0b" />
    <text x="38" y="27" fill="#f59e0b" font-family="'DM Mono', monospace" font-size="11" font-weight="700">BLAST RADIUS AUDIT</text>
    <text x="38" y="44" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Selected: aws_subnet.db_primary</text>

    <!-- Stat Counters -->
    <line x1="230" y1="12" x2="230" y2="52" stroke="#232936" stroke-width="1" />
    <g transform="translate(244, 18)">
      <text x="0" y="14" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="9">DIRECT</text>
      <text x="0" y="32" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="14" font-weight="700">2</text>
    </g>
    <g transform="translate(304, 18)">
      <text x="0" y="14" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="9">TRANSITIVE</text>
      <text x="0" y="32" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="14" font-weight="700">5</text>
    </g>
    <g transform="translate(384, 18)">
      <text x="0" y="14" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="9">MUTATING</text>
      <text x="0" y="32" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="14" font-weight="700">3</text>
    </g>

    <!-- Subgraph Isolation Action & Stepper Buttons -->
    <line x1="454" y1="12" x2="454" y2="52" stroke="#232936" stroke-width="1" />
    <g transform="translate(468, 16)">
      <rect width="128" height="32" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" />
      <text x="14" y="20" fill="#fbbf24" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Isolate Subgraph</text>
      <rect x="106" y="8" width="16" height="16" rx="3" fill="#0f121a" />
      <text x="110" y="20" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="10">B</text>
    </g>
  </g>

  <!-- SUBGRAPH TOOLBAR STRIP (Under HUD) -->
  <g id="subgraph-stepper-strip" transform="translate(280, 102)">
    <rect width="400" height="36" rx="6" fill="#161b26" stroke="#232936" />
    <text x="16" y="22" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Traversal Depth:</text>
    
    <!-- Depth Steppers -->
    <rect x="110" y="7" width="56" height="22" rx="4" fill="#0f121a" stroke="#232936" />
    <text x="122" y="22" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">1-Hop</text>

    <rect x="172" y="7" width="56" height="22" rx="4" fill="#0f121a" stroke="#232936" />
    <text x="184" y="22" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">2-Hop</text>

    <rect x="234" y="7" width="46" height="22" rx="4" fill="#0ea5e9" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="246" y="22" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10" font-weight="600">ALL</text>

    <!-- Mutating Only Toggle -->
    <line x1="290" y1="8" x2="290" y2="28" stroke="#232936" />
    <rect x="300" y="7" width="90" height="22" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <circle cx="310" cy="18" r="3" fill="#10b981" />
    <text x="320" y="22" fill="#34d399" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600">Mutating Only</text>
  </g>

  <!-- SELECTED SOURCE MUTATING NODE (Center Left) -->
  <g transform="translate(80, 240)">
    <!-- Pulse Ring Effect -->
    <rect x="-8" y="-8" width="236" height="116" rx="14" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <!-- Node Body -->
    <rect width="220" height="100" rx="8" fill="#0f121a" stroke="#f59e0b" stroke-width="2.5" />
    <rect x="0" y="0" width="220" height="28" rx="8" fill="#1c202d" />
    <rect x="10" y="6" width="70" height="16" rx="4" fill="#f59e0b" fill-opacity="0.2" />
    <text x="16" y="18" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="10" font-weight="700">± REPLACE</text>
    <circle cx="196" cy="14" r="5" fill="#f59e0b" />
    <text x="12" y="52" fill="#ffffff" font-family="'DM Mono', monospace" font-size="12" font-weight="600">aws_subnet</text>
    <text x="12" y="72" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="11">.db_primary</text>
    <text x="12" y="90" fill="#f43f5e" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500">Forces replacement: cidr_block</text>
  </g>

  <!-- DIRECT CASUALTY 1 (Middle Tier Top) -->
  <g transform="translate(390, 180)">
    <rect width="220" height="88" rx="8" fill="#0f121a" stroke="#f59e0b" stroke-width="1.8" />
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#161b26" />
    <rect x="10" y="5" width="70" height="16" rx="4" fill="#f59e0b" fill-opacity="0.2" />
    <text x="16" y="17" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="10" font-weight="700">± REPLACE</text>
    <text x="12" y="48" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="12" font-weight="600">aws_db_subnet_group</text>
    <text x="12" y="68" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">.aurora_subnets</text>
  </g>

  <!-- DIRECT CASUALTY 2 (Middle Tier Bottom) -->
  <g transform="translate(390, 340)">
    <rect width="220" height="88" rx="8" fill="#0f121a" stroke="#0ea5e9" stroke-width="1.8" />
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#161b26" />
    <rect x="10" y="5" width="60" height="16" rx="4" fill="#0ea5e9" fill-opacity="0.2" />
    <text x="16" y="17" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10" font-weight="700">~ UPDATE</text>
    <text x="12" y="48" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="12" font-weight="600">aws_route_table</text>
    <text x="12" y="68" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">.private_database</text>
  </g>

  <!-- TRANSITIVE CASUALTY 1 (Downstream Far Right Top) -->
  <g transform="translate(700, 180)">
    <rect width="220" height="88" rx="8" fill="#0f121a" stroke="#f43f5e" stroke-width="2" />
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#1c1924" />
    <rect x="10" y="5" width="70" height="16" rx="4" fill="#f43f5e" fill-opacity="0.2" />
    <text x="16" y="17" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="10" font-weight="700">± REPLACE</text>
    <text x="12" y="48" fill="#ffffff" font-family="'DM Mono', monospace" font-size="12" font-weight="600">aws_rds_cluster</text>
    <text x="12" y="68" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="11">.production_db</text>
  </g>

  <!-- TRANSITIVE CASUALTY 2 (Downstream Far Right Bottom) -->
  <g transform="translate(700, 340)">
    <rect width="220" height="88" rx="8" fill="#0f121a" stroke="#a855f7" stroke-width="1.8" />
    <rect x="0" y="0" width="220" height="26" rx="8" fill="#191624" />
    <rect x="10" y="5" width="70" height="16" rx="4" fill="#a855f7" fill-opacity="0.2" />
    <text x="16" y="17" fill="#c084fc" font-family="'DM Mono', monospace" font-size="10" font-weight="700">DATA / READ</text>
    <text x="12" y="48" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="12" font-weight="600">aws_secretsmanager</text>
    <text x="12" y="68" fill="#a855f7" font-family="'DM Mono', monospace" font-size="11">.db_credentials</text>
  </g>

  <!-- Connective Amber Flow Paths (High-voltage blast lines) -->
  <path d="M 300 270 Q 345 224 390 224" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrow-br)" />
  <path d="M 300 310 Q 345 384 390 384" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrow-br)" />
  <path d="M 610 224 L 700 224" stroke="#f43f5e" stroke-width="2.5" fill="none" marker-end="url(#arrow-br)" />
  <path d="M 610 240 Q 655 384 700 384" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-purple)" />

  <!-- CALLOUT PINS & LEADER LINES -->

  <!-- PIN 1: Blast Radius HUD -->
  <line x1="370" y1="88" x2="370" y2="128" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(370, 142)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow-br)" />
    <text x="0" y="4" text-anchor="middle" fill="#fbbf24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">1</text>
  </g>

  <!-- PIN 2: Subgraph Isolation Button -->
  <line x1="708" y1="56" x2="750" y2="88" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(762, 98)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow-br)" />
    <text x="0" y="4" text-anchor="middle" fill="#fbbf24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">2</text>
  </g>

  <!-- PIN 3: Depth Filter Stepper -->
  <line x1="520" y1="138" x2="520" y2="152" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(520, 166)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow-br)" />
    <text x="0" y="4" text-anchor="middle" fill="#fbbf24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">3</text>
  </g>

  <!-- PIN 4: Mutating Only Filter -->
  <line x1="630" y1="138" x2="630" y2="152" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(630, 166)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow-br)" />
    <text x="0" y="4" text-anchor="middle" fill="#fbbf24" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">4</text>
  </g>
</svg>
