name: golangci-lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golangci:
    name: Check Go Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Go version in go.mod is 1.27.1; build from source using runner's Go 1.27 toolchain
          version: latest
          install-mode: goinstall
          args: --timeout=5m --disable-all --enable=gofmt --enable=goimports
