<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dots-cn" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2638" />
    </pattern>
    <filter id="glow-cn" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#0ea5e9" flood-opacity="0.6"/>
    </filter>
    <marker id="arrow-cn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b4861"/>
    </marker>
    <marker id="arrow-bridge-cn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" fill="#090a0f" />
  <rect width="960" height="540" fill="url(#grid-dots-cn)" />

  <!-- Mock Header Toolbar -->
  <rect x="20" y="16" width="920" height="46" rx="8" fill="#0f121a" stroke="#232936" stroke-width="1.5" />
  <circle cx="44" cy="39" r="6" fill="#10b981" />
  <text x="60" y="43" fill="#e2e8f0" font-family="'DM Mono', monospace" font-size="13" font-weight="600">PLAN-PARSE WORKBENCH</text>
  <rect x="230" y="27" width="60" height="24" rx="4" fill="#161b26" stroke="#232936" />
  <text x="242" y="43" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">240 nodes</text>

  <!-- Header Toggle for Mutations Only [Active] -->
  <g id="header-toggle-group">
    <rect x="680" y="25" width="240" height="28" rx="6" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1.5" />
    <circle cx="700" cy="39" r="4" fill="#0ea5e9" />
    <text x="714" y="43" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Mutations Only: Active</text>
    <rect x="852" y="29" width="58" height="20" rx="4" fill="#0f121a" stroke="#0ea5e9" stroke-opacity="0.4" />
    <text x="860" y="43" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="11" font-weight="500">[C] 18 Collapsed</text>
  </g>

  <!-- Mutating Node 1: Root Ingress (UPDATE) -->
  <g transform="translate(80, 220)">
    <rect width="210" height="96" rx="8" fill="#0f121a" stroke="#0ea5e9" stroke-width="2" />
    <rect x="0" y="0" width="210" height="28" rx="8" fill="#161b26" />
    <rect x="10" y="6" width="60" height="16" rx="4" fill="#0ea5e9" fill-opacity="0.2" />
    <text x="18" y="18" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10" font-weight="700">~ UPDATE</text>
    <text x="10" y="50" fill="#f1f5f9" font-family="'DM Mono', monospace" font-size="12" font-weight="600">aws_security_group</text>
    <text x="10" y="70" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">.allow_tls_ingress</text>
    <text x="10" y="88" fill="#64748b" font-family="'DM Sans', sans-serif" font-size="10">Changes: 2 ingress rules modified</text>
  </g>

  <!-- Collapsed Cluster Pill 1 (Top Branch) -->
  <g transform="translate(380, 140)">
    <rect width="200" height="60" rx="30" fill="#161b26" stroke="#3b4861" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="34" cy="30" r="14" fill="#232936" stroke="#475569" />
    <text x="28" y="34" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="12" font-weight="600">12</text>
    <text x="58" y="28" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Unchanged Nodes</text>
    <text x="58" y="44" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">module.vpc.* (no-op)</text>
  </g>

  <!-- Collapsed Cluster Pill 2 (Bottom Branch) -->
  <g transform="translate(380, 340)">
    <rect width="200" height="60" rx="30" fill="#161b26" stroke="#3b4861" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="34" cy="30" r="14" fill="#232936" stroke="#475569" />
    <text x="30" y="34" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="12" font-weight="600">6</text>
    <text x="58" y="28" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Unchanged Nodes</text>
    <text x="58" y="44" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">module.iam.* (no-op)</text>
  </g>

  <!-- Mutating Node 2: App Service (REPLACE) -->
  <g transform="translate(680, 220)">
    <rect width="210" height="96" rx="8" fill="#0f121a" stroke="#f59e0b" stroke-width="2" />
    <rect x="0" y="0" width="210" height="28" rx="8" fill="#161b26" />
    <rect x="10" y="6" width="68" height="16" rx="4" fill="#f59e0b" fill-opacity="0.2" />
    <text x="16" y="18" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="10" font-weight="700">± REPLACE</text>
    <text x="10" y="50" fill="#f1f5f9" font-family="'DM Mono', monospace" font-size="12" font-weight="600">aws_ecs_service</text>
    <text x="10" y="70" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">.production_api</text>
    <text x="10" y="88" fill="#f59e0b" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500">Forces replacement: launch_type</text>
  </g>

  <!-- Connective Arrows & Synthetic Bridging Edge -->
  <!-- 1. Node 1 to Collapsed 1 -->
  <path d="M 290 240 Q 330 170 380 170" stroke="#3b4861" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-cn)" />
  <!-- 2. Collapsed 1 to Node 2 -->
  <path d="M 580 170 Q 630 170 680 240" stroke="#3b4861" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-cn)" />

  <!-- 3. Node 1 to Collapsed 2 -->
  <path d="M 290 290 Q 330 370 380 370" stroke="#3b4861" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-cn)" />
  <!-- 4. Collapsed 2 to Node 2 -->
  <path d="M 580 370 Q 630 370 680 290" stroke="#3b4861" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-cn)" />

  <!-- Direct Synthetic Bridging Edge (Transitive closure) -->
  <path d="M 290 268 L 680 268" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-bridge-cn)" />
  <rect x="424" y="254" width="120" height="20" rx="4" fill="#090a0f" stroke="#0ea5e9" stroke-width="1" />
  <text x="432" y="268" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="9" font-weight="600">TRANSITIVE BRIDGE</text>

  <!-- CALLOUT PINS & LEADER LINES -->

  <!-- PIN 1: Collapsed Cluster Pill -->
  <line x1="480" y1="140" x2="480" y2="90" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(480, 80)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-cn)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">1</text>
  </g>

  <!-- PIN 2: Synthetic Transitive Bridging Edge -->
  <line x1="484" y1="274" x2="484" y2="440" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(484, 452)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-cn)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">2</text>
  </g>

  <!-- PIN 3: Header Toggle & Counter -->
  <line x1="800" y1="53" x2="800" y2="96" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(800, 110)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-cn)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">3</text>
  </g>

  <!-- PIN 4: Mutating Node Focus -->
  <line x1="185" y1="316" x2="185" y2="390" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(185, 404)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-cn)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">4</text>
  </g>
</svg>
