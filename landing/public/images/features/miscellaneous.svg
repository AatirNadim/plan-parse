<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dots-ms" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2638" />
    </pattern>
    <filter id="glow-ms" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#0ea5e9" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#090a0f" />

  <!-- TOP-LEFT: GLOBAL COMMAND PALETTE (Callout 1) -->
  <g transform="translate(40, 24)">
    <rect width="440" height="200" rx="10" fill="#0f121a" stroke="#232936" stroke-width="1.5" />
    <!-- Header Input -->
    <rect width="440" height="44" rx="10" fill="#161b26" />
    <circle cx="20" cy="22" r="5" stroke="#38bdf8" stroke-width="1.5" fill="none" />
    <text x="36" y="27" fill="#ffffff" font-family="'DM Sans', sans-serif" font-size="13">Jump to resource or command...</text>
    <rect x="382" y="12" width="44" height="20" rx="4" fill="#090a0f" stroke="#232936" />
    <text x="390" y="26" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">⌘K</text>

    <!-- Palette Results List -->
    <g transform="translate(12, 54)">
      <!-- Item 1 [Active] -->
      <rect width="416" height="34" rx="6" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="12" y="22" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="11">aws_rds_cluster.production_db</text>
      <text x="340" y="22" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">± REPLACE</text>

      <!-- Item 2 -->
      <g transform="translate(0, 40)">
        <rect width="416" height="30" rx="6" fill="#141824" />
        <text x="12" y="20" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Toggle Mutations Only</text>
        <text x="390" y="20" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">C</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 76)">
        <rect width="416" height="30" rx="6" fill="#141824" />
        <text x="12" y="20" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Export Architecture Diagram</text>
        <text x="382" y="20" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">⌘E</text>
      </g>
    </g>
  </g>

  <!-- TOP-RIGHT: HIGH-DPI RETINA DIAGRAM EXPORT (Callout 2) -->
  <g transform="translate(520, 24)">
    <rect width="400" height="200" rx="10" fill="#0f121a" stroke="#232936" stroke-width="1.5" />
    <rect width="400" height="36" rx="10" fill="#161b26" />
    <text x="16" y="23" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Export Canvas Architecture</text>
    <rect x="340" y="8" width="46" height="20" rx="4" fill="#090a0f" />
    <text x="348" y="22" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">Retina</text>

    <!-- Export Format Options -->
    <g transform="translate(16, 50)">
      <!-- SVG Vector Option -->
      <rect width="176" height="60" rx="6" fill="#161b26" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="12" y="24" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Vector SVG</text>
      <text x="12" y="42" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="10">Infinite zoom • Text selectable</text>

      <!-- PNG Retina Option -->
      <g transform="translate(192, 0)">
        <rect width="176" height="60" rx="6" fill="#161b26" stroke="#232936" />
        <text x="12" y="24" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Retina 2.5x PNG</text>
        <text x="12" y="42" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="10">3840×2160 crisp resolution</text>
      </g>
    </g>

    <!-- Download Trigger Button -->
    <g transform="translate(16, 130)">
      <rect width="368" height="34" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.2" />
      <text x="120" y="22" fill="#34d399" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Export Architecture Diagram</text>
    </g>
  </g>

  <!-- BOTTOM-LEFT: TARGETED APPLY GENERATOR (Callout 3) -->
  <g transform="translate(40, 260)">
    <rect width="440" height="150" rx="10" fill="#0f121a" stroke="#232936" stroke-width="1.5" />
    <rect width="440" height="34" rx="10" fill="#161b26" />
    <text x="16" y="22" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Targeted Apply Generator</text>
    <rect x="360" y="8" width="66" height="18" rx="4" fill="#090a0f" />
    <text x="368" y="21" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="9">CLI SYNTAX</text>

    <g transform="translate(16, 46)">
      <text x="0" y="14" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Selected 2 resources with upstream dependencies:</text>
      
      <!-- Copyable Terminal Box -->
      <g transform="translate(0, 24)">
        <rect width="408" height="56" rx="6" fill="#090a0f" stroke="#232936" />
        <text x="12" y="24" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="10">terraform apply \</text>
        <text x="24" y="42" fill="#34d399" font-family="'DM Mono', monospace" font-size="10">  -target="module.vpc.aws_subnet.private[0]"</text>
        <!-- Copy Chip -->
        <rect x="350" y="10" width="46" height="20" rx="3" fill="#161b26" stroke="#232936" />
        <text x="358" y="24" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="9">Copy</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM-RIGHT: KEYBOARD CHEAT SHEET MODAL (Callout 4) -->
  <g transform="translate(520, 260)">
    <rect width="400" height="150" rx="10" fill="#0f121a" stroke="#232936" stroke-width="1.5" />
    <rect width="400" height="34" rx="10" fill="#161b26" />
    <text x="16" y="22" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="12" font-weight="600">Keyboard Shortcuts Cheat Sheet</text>
    <rect x="356" y="8" width="28" height="18" rx="4" fill="#090a0f" />
    <text x="366" y="21" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">?</text>

    <!-- Grid of Keybindings -->
    <g transform="translate(16, 48)">
      <g transform="translate(0, 0)">
        <rect width="20" height="20" rx="3" fill="#161b26" stroke="#3b4861" />
        <text x="6" y="15" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="11">C</text>
        <text x="28" y="15" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Mutations only</text>
      </g>

      <g transform="translate(130, 0)">
        <rect width="20" height="20" rx="3" fill="#161b26" stroke="#3b4861" />
        <text x="6" y="15" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="11">B</text>
        <text x="28" y="15" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Blast radius</text>
      </g>

      <g transform="translate(250, 0)">
        <rect width="44" height="20" rx="3" fill="#161b26" stroke="#3b4861" />
        <text x="6" y="15" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">Space</text>
        <text x="52" y="15" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Tier 1 popover</text>
      </g>

      <g transform="translate(0, 34)">
        <rect width="20" height="20" rx="3" fill="#161b26" stroke="#3b4861" />
        <text x="6" y="15" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="11">D</text>
        <text x="28" y="15" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Deep HCL diff</text>
      </g>

      <g transform="translate(130, 34)">
        <rect width="20" height="20" rx="3" fill="#161b26" stroke="#3b4861" />
        <text x="7" y="15" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="11">[</text>
        <text x="28" y="15" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Toggle sidebar</text>
      </g>

      <g transform="translate(250, 34)">
        <rect width="20" height="20" rx="3" fill="#161b26" stroke="#3b4861" />
        <text x="7" y="15" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="11">]</text>
        <text x="28" y="15" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Toggle inspector</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM BAR: THEME ENGINE & DIAGNOSTIC CLI ERRORS (Callout 5 & 6) -->
  <g transform="translate(40, 440)">
    <rect width="880" height="74" rx="8" fill="#0f121a" stroke="#232936" stroke-width="1.5" />
    
    <!-- Theme Switcher Preview (Callout 5) -->
    <g transform="translate(20, 16)">
      <text x="0" y="18" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Theme Engine (T):</text>
      <!-- Dark swatch -->
      <g transform="translate(120, 0)">
        <rect width="130" height="38" rx="5" fill="#090a0f" stroke="#0ea5e9" stroke-width="1.5" />
        <circle cx="16" cy="19" r="6" fill="#090a0f" stroke="#38bdf8" stroke-width="1.5" />
        <text x="30" y="23" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Dark #090a0f</text>
      </g>
      <!-- Light swatch -->
      <g transform="translate(260, 0)">
        <rect width="130" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <circle cx="16" cy="19" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
        <text x="30" y="23" fill="#0f172a" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Light #f8fafc</text>
      </g>
    </g>

    <!-- Diagnostic CLI Errors (Callout 6) -->
    <g transform="translate(440, 16)">
      <line x1="0" y1="0" x2="0" y2="42" stroke="#232936" />
      <g transform="translate(20, 0)">
        <text x="0" y="16" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Diagnostic CLI Classifier:</text>
        <g transform="translate(0, 20)">
          <rect width="180" height="22" rx="4" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" />
          <text x="8" y="15" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="9" font-weight="600">INITIALIZATION_REQUIRED</text>

          <rect x="188" y="0" width="120" height="22" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
          <text x="196" y="15" fill="#fbbf24" font-family="'DM Mono', monospace" font-size="9" font-weight="600">AUTHENTICATION</text>
        </g>
      </g>
    </g>
  </g>

  <!-- CALLOUT PINS & LEADER LINES -->

  <!-- PIN 1: Command Palette -->
  <line x1="260" y1="120" x2="260" y2="150" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(260, 160)">
    <circle cx="0" cy="0" r="14" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ms)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700">1</text>
  </g>

  <!-- PIN 2: High-DPI Diagram Export -->
  <line x1="720" y1="100" x2="720" y2="150" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(720, 160)">
    <circle cx="0" cy="0" r="14" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ms)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700">2</text>
  </g>

  <!-- PIN 3: Targeted Apply Generator -->
  <line x1="260" y1="360" x2="260" y2="390" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(260, 400)">
    <circle cx="0" cy="0" r="14" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ms)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700">3</text>
  </g>

  <!-- PIN 4: Keyboard Shortcuts Cheat Sheet -->
  <line x1="720" y1="350" x2="720" y2="390" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(720, 400)">
    <circle cx="0" cy="0" r="14" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ms)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700">4</text>
  </g>

  <!-- PIN 5: Theme Engine -->
  <line x1="240" y1="480" x2="240" y2="505" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(240, 516)">
    <circle cx="0" cy="0" r="14" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ms)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700">5</text>
  </g>

  <!-- PIN 6: Diagnostic CLI Errors -->
  <line x1="680" y1="480" x2="680" y2="505" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(680, 516)">
    <circle cx="0" cy="0" r="14" fill="#090a0f" stroke="#0ea5e9" stroke-width="2.5" filter="url(#glow-ms)" />
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700">6</text>
  </g>
</svg>
