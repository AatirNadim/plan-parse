<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-dots-rp" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2638" />
    </pattern>
    <filter id="glow-rp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="540" fill="#090a0f" />
  <rect width="960" height="540" fill="url(#grid-dots-rp)" />

  <!-- LEFT CANVAS AREA: Selected Node on Canvas -->
  <g transform="translate(60, 200)">
    <rect width="280" height="110" rx="10" fill="#0f121a" stroke="#8b5cf6" stroke-width="2" />
    <rect x="0" y="0" width="280" height="30" rx="10" fill="#161b26" />
    <rect x="12" y="6" width="60" height="18" rx="4" fill="#0ea5e9" fill-opacity="0.2" />
    <text x="18" y="19" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10" font-weight="700">~ UPDATE</text>
    <text x="12" y="56" fill="#ffffff" font-family="'DM Mono', monospace" font-size="13" font-weight="600">module.vpc.aws_subnet</text>
    <text x="12" y="76" fill="#c084fc" font-family="'DM Mono', monospace" font-size="12">.private[0]</text>
    <text x="12" y="96" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Selected &amp; active in inspector [ ] ]</text>
  </g>

  <!-- RIGHT SLIDE-OVER INSPECTOR PANEL -->
  <g transform="translate(420, 20)">
    <!-- Panel Shadow & Border Frame -->
    <rect width="500" height="500" rx="12" fill="#0f121a" stroke="#232936" stroke-width="1.8" />
    
    <!-- PANEL TOP BAR (Callout 1: Header & Copy Address) -->
    <g transform="translate(20, 16)">
      <rect width="460" height="74" rx="8" fill="#161b26" stroke="#232936" />
      <rect x="12" y="10" width="60" height="18" rx="4" fill="#0ea5e9" fill-opacity="0.2" />
      <text x="18" y="23" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10" font-weight="700">~ UPDATE</text>
      
      <!-- Close / Toggle key -->
      <rect x="418" y="10" width="30" height="20" rx="4" fill="#090a0f" stroke="#232936" />
      <text x="428" y="24" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">]</text>

      <!-- Full Address String -->
      <text x="12" y="48" fill="#f8fafc" font-family="'DM Mono', monospace" font-size="13" font-weight="600">module.vpc.aws_subnet.private[0]</text>
      
      <!-- One-Click Copy Address Chip -->
      <g transform="translate(12, 54)">
        <rect width="116" height="18" rx="3" fill="#090a0f" stroke="#3b4861" />
        <text x="8" y="13" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">Copy HCL Address</text>
      </g>
    </g>

    <!-- TABS BAR (Attribute Diff, Lineage, Raw JSON) -->
    <g transform="translate(20, 102)">
      <!-- Tab 1: Attribute Diff [Active] -->
      <rect x="0" y="0" width="120" height="28" rx="5" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="12" y="18" fill="#c084fc" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Attribute Diff</text>

      <!-- Tab 2: Lineage Navigation -->
      <rect x="130" y="0" width="90" height="28" rx="5" fill="#161b26" stroke="#232936" />
      <text x="142" y="18" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Lineage</text>

      <!-- Tab 3: Raw JSON Definition -->
      <rect x="230" y="0" width="90" height="28" rx="5" fill="#161b26" stroke="#232936" />
      <text x="242" y="18" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11">Raw JSON</text>
    </g>

    <!-- ATTRIBUTE DIFF VIEW CONTENT (Callout 2) -->
    <g transform="translate(20, 140)">
      <rect width="460" height="160" rx="8" fill="#090a0f" stroke="#232936" />
      <rect width="460" height="26" rx="8" fill="#141824" />
      <text x="12" y="18" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Delta Inspection (Before vs After)</text>

      <g transform="translate(12, 38)">
        <text x="0" y="16" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">cidr_block:</text>
        <rect x="0" y="24" width="436" height="22" fill="#f43f5e" fill-opacity="0.15" />
        <text x="8" y="39" fill="#f43f5e" font-family="'DM Mono', monospace" font-size="11">- "10.0.1.0/24" (current state)</text>

        <rect x="0" y="50" width="436" height="22" fill="#10b981" fill-opacity="0.15" />
        <text x="8" y="65" fill="#34d399" font-family="'DM Mono', monospace" font-size="11">+ "10.0.2.0/24" (planned state)</text>

        <text x="0" y="94" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="11">map_public_ip_on_launch:</text>
        <text x="0" y="112" fill="#64748b" font-family="'DM Mono', monospace" font-size="11">= false (unchanged)</text>
      </g>
    </g>

    <!-- LINEAGE NAVIGATION CHIPS (Callout 3) -->
    <g transform="translate(20, 314)">
      <rect width="460" height="86" rx="8" fill="#161b26" stroke="#232936" />
      <text x="12" y="22" fill="#e2e8f0" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600">Dependency Lineage Navigation</text>
      <text x="12" y="38" fill="#94a3b8" font-family="'DM Sans', sans-serif" font-size="10">Clicking chips centers canvas on related node</text>

      <g transform="translate(12, 48)">
        <!-- Depends On Chip -->
        <rect width="190" height="26" rx="4" fill="#0f121a" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="8" y="17" fill="#c084fc" font-family="'DM Mono', monospace" font-size="10">↑ Depends: aws_vpc.main</text>

        <!-- Referenced By Chip -->
        <g transform="translate(200, 0)">
          <rect width="220" height="26" rx="4" fill="#0f121a" stroke="#0ea5e9" stroke-width="1.2" />
          <text x="8" y="17" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10">↓ Ref By: aws_route_table.pvt</text>
        </g>
      </g>
    </g>

    <!-- RAW JSON DEFINITION PREVIEW (Callout 4) -->
    <g transform="translate(20, 412)">
      <rect width="460" height="74" rx="8" fill="#0b0e16" stroke="#232936" />
      <rect width="460" height="22" rx="8" fill="#141824" />
      <text x="12" y="16" fill="#94a3b8" font-family="'DM Mono', monospace" font-size="10">RAW SCHEMA JSON PREVIEW</text>
      <text x="12" y="38" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">&#123; "type": "aws_subnet", "change": &#123; "actions": ["update"],</text>
      <text x="12" y="54" fill="#64748b" font-family="'DM Mono', monospace" font-size="10">  "before": &#123; "cidr_block": "10.0.1.0/24" &#125;, "after": &#123; ... &#125; &#125; &#125;</text>
    </g>
  </g>

  <!-- CALLOUT PINS & LEADER LINES -->

  <!-- PIN 1: Resource Header & Copy Address -->
  <line x1="440" y1="56" x2="390" y2="56" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(376, 56)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow-rp)" />
    <text x="0" y="4" text-anchor="middle" fill="#c084fc" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">1</text>
  </g>

  <!-- PIN 2: Attribute Diff View -->
  <line x1="440" y1="220" x2="390" y2="220" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(376, 220)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow-rp)" />
    <text x="0" y="4" text-anchor="middle" fill="#c084fc" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">2</text>
  </g>

  <!-- PIN 3: Lineage Navigation Chips -->
  <line x1="440" y1="350" x2="390" y2="350" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(376, 350)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow-rp)" />
    <text x="0" y="4" text-anchor="middle" fill="#c084fc" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">3</text>
  </g>

  <!-- PIN 4: Raw JSON Definition -->
  <line x1="440" y1="440" x2="390" y2="440" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="2 2" />
  <g class="callout-pin" transform="translate(376, 440)">
    <circle cx="0" cy="0" r="16" fill="#090a0f" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow-rp)" />
    <text x="0" y="4" text-anchor="middle" fill="#c084fc" font-family="'DM Sans', sans-serif" font-size="13" font-weight="700">4</text>
  </g>
</svg>
